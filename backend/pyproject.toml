[project]
name = "veil-backend"
version = "0.1.0"
description = "Veil web app backend: extract text and layout, redact through Mubit, return the redacted file"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "evalkit",
    # app/ingest (OCR for scans and photos, from the ocr/ingest branch)
    "pypdfium2>=5.14",
    "pillow>=13.0",
    "pillow-heif>=1.8",
    "pyobjc-framework-Vision>=12.2; sys_platform == \"darwin\"",
    "anthropic==2.2.0",
]

[tool.uv.sources]
evalkit = { path = "../evalkit", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
