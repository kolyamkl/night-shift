[project]
name = "veil-backend"
version = "0.1.0"
description = "MuGuard backend: extract text and layout, redact through Mubit, return the redacted file"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=44",
    "argon2-cffi>=25.1",
    # app/ingest (OCR for scans and photos, from the ocr/ingest branch)
    "pypdfium2>=5.14",
    "pillow>=13.0",
    "pillow-heif>=1.8",
    "pyobjc-framework-Vision>=12.2; sys_platform == \"darwin\"",
    "anthropic==2.2.0",
    "pydantic-settings>=2.12,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "PT", "T20", "DTZ", "RET", "ARG", "PTH", "PL", "RUF",
    "FAST", "BLE", "TRY",
]
ignore = [
    "PLR2004",  # magic values: thresholds and status codes read best where they are used
    "PLR0913",  # FastAPI endpoints and the pipeline take many parameters by design
    "TRY003",   # messages are written for users at the raise site
    "N818",     # exceptions named for the condition read better: DocumentNotFound, StaleRevision
    "RUF001",   # regexes and prompts hold deliberate look-alike characters (homoglyph repairs)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "S108", "ARG001", "ARG002", "ARG005", "PLR0915", "PLR0917", "PLC0415", "PT006", "PT011",
    "PT018", "N802", "B023", "B905", "TRY300",
]
# Kept as written by their authors: OCR page reading and geometry (macOS-only imports stay lazy).
"app/ingest/**" = ["PLR0911", "PLR0912", "PLR0915", "SIM108", "C416", "B905", "PLC0415"]
"app/redaction/ocr.py" = ["SIM108", "PLW2901"]
"app/llm/prompts.py" = ["E501"]  # frozen prompt text: Mubit fingerprints it, so no rewrapping
"app/llm/providers.py" = ["PLR0917", "ARG001"]  # every provider call has the same signature (Call)

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["app.ingest.*", "app.redaction.ocr"]  # OCR geometry: typed at the boundaries only
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "Vision.*", "Quartz.*", "Foundation.*", "objc.*", "pillow_heif.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]  # its hints are incomplete (Document is iterable, constants are missing)
follow_imports = "skip"
