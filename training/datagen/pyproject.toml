[project]
name = "datagen"
version = "0.1.0"
description = "Synthetic UK document generator with gold PII span labels (Veil / Mubit Night Shift)"
authors = [
    { name = "Dmytro Burdeniuk", email = "dmytroburdenuk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "fpdf2>=2.8.9",
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "pytest>=9.1.1",
]

[project.scripts]
datagen = "datagen.generate:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
