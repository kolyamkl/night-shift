[project]
name = "dataconv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmytro Burdeniuk", email = "dmytroburdenuk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "huggingface-hub>=2.3.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
]

[project.scripts]
dataconv = "dataconv:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
