[project]
name = "evalkit"
version = "0.1.0"
description = "Veil: T1 prompt, redaction and restore, regex baseline, scoring, and the Mubit batch sender"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]
